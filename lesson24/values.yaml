# Global settings
global:
  storageClass: "standard"

# WordPress settings
wordpress:
  enabled: true
  image:
    repository: wordpress
    tag: 6.4-php8.2-apache
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
  env:
    WORDPRESS_DB_HOST: "wordpress-mysql"
    WORDPRESS_DB_NAME: "wordpress"
    WORDPRESS_TABLE_PREFIX: "wp_"
    WORDPRESS_DEBUG: "false"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: wordpress.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    annotations: {}

# MySQL settings
mysql:
  enabled: true
  image:
    repository: mysql
    tag: 8.0
    pullPolicy: IfNotPresent
  auth:
    rootPassword: ""
    database: "wordpress"
    username: "wordpress"
    password: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
      accessMode: ReadWriteOnce
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  secondary:
    replicaCount: 0
  networkPolicy:
    enabled: true
    allowExternal: false

# Secret settings (passwords will be auto-generated if empty)
secrets:
  mysqlRootPassword: ""
  mysqlPassword: ""
  wordpressPassword: ""
