{{- if .Values.wordpress.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.wordpress.fullname" . }}-secret
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
data:
  WORDPRESS_DB_PASSWORD: {{ .Values.secrets.mysqlPassword | default (randAlphaNum 16) | b64enc | quote }}
{{- end }}
