{{- if .Values.wordpress.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress.wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
    component: wordpress
spec:
  type: {{ .Values.wordpress.service.type }}
  ports:
    - port: {{ .Values.wordpress.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "wordpress.selectorLabels" . | nindent 4 }}
    component: wordpress
{{- end }}
