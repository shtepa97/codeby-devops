{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.mysql.fullname" . }}-secret
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ .Values.secrets.mysqlRootPassword | default (randAlphaNum 20) | b64enc | quote }}
  mysql-password: {{ .Values.secrets.mysqlPassword | default (randAlphaNum 16) | b64enc | quote }}
{{- end }}
