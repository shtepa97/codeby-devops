{{- if and .Values.mysql.enabled .Values.mysql.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wordpress.mysql.fullname" . }}-networkpolicy
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wordpress.selectorLabels" . | nindent 6 }}
      component: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "wordpress.selectorLabels" . | nindent 14 }}
              component: wordpress
      ports:
        - port: 3306
          protocol: TCP
{{- end }}
