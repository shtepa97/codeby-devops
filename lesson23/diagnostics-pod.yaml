apiVersion: v1
kind: Pod
metadata:
  name: diagnostics-pod
  namespace: dev
spec:
  serviceAccountName: diagnostics-sa
  containers:
  - name: diagnostics
    image: bitnami/kubectl:latest
    command: ["/bin/sh", "-c"]
    args:
    - >
      echo "Starting diagnostics...";
      echo "Discovered WordPress pods:";
      kubectl get pods -n dev -l app=wordpress -o wide;
      echo "Current network policies:";
      kubectl get networkpolicies -n dev;
      sleep infinity
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
